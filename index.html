<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Anicca Yoga</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#152230" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Anicca Yoga" />

<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lucide@0.383.0/dist/umd/lucide.js"></script>

<style>
  html, body { margin: 0; background: #152230; }
  @keyframes breathe {
    0%, 100% { transform: scale(0.85); opacity: 0.75; }
    50% { transform: scale(1.15); opacity: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

function Icon({ name, className }) {
  useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return <i data-lucide={name} className={className}></i>;
}

const CLASSES = [
  { id: 1, name: "朝陽のヴィンヤサ", level: "初級", minutes: 12, mood: "からだを起こす", youtubeId: "rxfT1uRG3wA" },
  { id: 2, name: "月夜のリストラティブ", level: "初級", minutes: 18, mood: "深く緩める", youtubeId: "rtmtDIxitME" },
  { id: 3, name: "根を張るハタ", level: "中級", minutes: 20, mood: "軸を整える", youtubeId: "E40UuweGD1Y" },
  { id: 4, name: "静寂のバランス", level: "上級", minutes: 25, mood: "集中を研ぐ", youtubeId: "ArjvegaWtms" },
];

function Building({ onEnter }) {
  return (
    <div className="flex flex-col items-center gap-8">
      <h1 className="text-4xl tracking-[0.15em] text-[#E9DEC0]" style={{ fontFamily: "'Shippori Mincho', serif" }}>
        Anicca Yoga
      </h1>
      <p className="text-[#9FB0A6] text-sm tracking-wide">アニッチャヨガ ― とある路地裏、灯りの点る二階建て</p>
      <button onClick={onEnter} className="group relative">
        <svg width="260" height="300" viewBox="0 0 260 300" className="drop-shadow-2xl">
          <polygon points="20,70 130,20 240,70" fill="#2E4A3E" />
          <polygon points="10,72 130,15 250,72 250,80 10,80" fill="#1D3229" />
          <rect x="30" y="80" width="200" height="105" fill="#243A52" stroke="#0F1B28" strokeWidth="3" />
          <rect x="50" y="105" width="45" height="55" rx="2" fill="#E8C878" opacity="0.9" />
          <rect x="165" y="105" width="45" height="55" rx="2" fill="#E8C878" opacity="0.7" />
          <text x="130" y="145" textAnchor="middle" fontSize="11" fill="#C9A66B" style={{ fontFamily: "'Shippori Mincho', serif" }}>studio ・2F</text>
          <rect x="30" y="185" width="200" height="100" fill="#3A2E22" stroke="#0F1B28" strokeWidth="3" />
          <rect x="50" y="205" width="160" height="45" rx="2" fill="#F0EBDD" opacity="0.85" />
          <text x="130" y="232" textAnchor="middle" fontSize="11" fill="#3A2E22" style={{ fontFamily: "'Shippori Mincho', serif" }}>cafe ・1F</text>
          <rect x="115" y="250" width="30" height="35" fill="#0F1B28" />
          <circle cx="140" cy="267" r="1.6" fill="#E8C878" />
        </svg>
        <p className="mt-3 text-[#C9A66B] text-xs tracking-[0.3em] group-hover:tracking-[0.4em] transition-all">扉を開ける →</p>
      </button>
    </div>
  );
}

function Cafe({ onUpstairs }) {
  return (
    <div className="flex flex-col items-center gap-6 max-w-sm text-center">
      <Icon name="coffee" className="w-8 h-8 text-[#C9A66B]" />
      <h2 className="text-2xl text-[#E9DEC0]" style={{ fontFamily: "'Shippori Mincho', serif" }}>1階・Anicca Cafe</h2>
      <p className="text-[#9FB0A6] text-sm leading-relaxed">木の匙が触れる音だけが響く店内。奥の階段が、2階のスタジオへ続いている。</p>
      <div className="w-full border-t border-[#3A4A42] my-2" />
      <p className="text-xs text-[#7C8C82] tracking-widest">本日のおすすめ ― 生姜と柚子のホットドリンク</p>
      <button onClick={onUpstairs} className="flex items-center gap-2 px-6 py-3 bg-[#4A6B4D] text-[#F0EBDD] text-sm tracking-wide hover:bg-[#5A7B5D] transition-colors">
        <Icon name="arrow-up" className="w-4 h-4" /> 階段をのぼる
      </button>
    </div>
  );
}

function Studio({ onBack, onSelect }) {
  return (
    <div className="flex flex-col items-center gap-6 w-full max-w-md">
      <div className="flex items-center gap-2 text-[#C9A66B]">
        <Icon name="flame" className="w-6 h-6" />
        <h2 className="text-2xl" style={{ fontFamily: "'Shippori Mincho', serif" }}>2階・スタジオ</h2>
      </div>
      <p className="text-[#9FB0A6] text-sm text-center">灯りの下、四枚のマットが並んでいる。座りたい場所を選ぶ。</p>
      <div className="w-full flex flex-col gap-3">
        {CLASSES.map((c) => (
          <button key={c.id} onClick={() => onSelect(c)} className="flex items-center justify-between px-5 py-4 bg-[#1F3348] border border-[#2E4A3E] hover:border-[#C9A66B] transition-colors text-left">
            <div>
              <p className="text-[#E9DEC0] text-base" style={{ fontFamily: "'Shippori Mincho', serif" }}>{c.name}</p>
              <p className="text-[#7C8C82] text-xs mt-1 tracking-wide">{c.level} ・ {c.minutes}分 ・ {c.mood}</p>
            </div>
            <Icon name="door-open" className="w-5 h-5 text-[#C9A66B] shrink-0" />
          </button>
        ))}
      </div>
      <button onClick={onBack} className="flex items-center gap-2 text-xs text-[#7C8C82] hover:text-[#C9A66B] mt-2">
        <Icon name="arrow-left" className="w-3 h-3" /> カフェへ戻る
      </button>
    </div>
  );
}

function Session({ cls, onEnd }) {
  const [playing, setPlaying] = useState(true);
  const [elapsed, setElapsed] = useState(0);

  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setElapsed((e) => e + 1), 1000);
    return () => clearInterval(t);
  }, [playing]);

  const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const ss = String(elapsed % 60).padStart(2, "0");

  return (
    <div className="flex flex-col items-center gap-6 w-full max-w-md">
      <p className="text-[#C9A66B] text-xs tracking-[0.3em]">NOW PLAYING</p>
      <h2 className="text-xl text-[#E9DEC0]" style={{ fontFamily: "'Shippori Mincho', serif" }}>{cls.name}</h2>

      {cls.youtubeId ? (
        <button onClick={() => window.open(`https://www.youtube.com/watch?v=${cls.youtubeId}`, "_blank")}
          className="relative w-full aspect-video bg-gradient-to-br from-[#1F3348] to-[#0F1B28] border border-[#2E4A3E] overflow-hidden group flex flex-col items-center justify-center gap-3">
          <div className="w-16 h-16 rounded-full bg-[#C9A66B]/90 flex items-center justify-center group-hover:bg-[#C9A66B] transition-colors">
            <Icon name="play" className="w-7 h-7 text-[#0F1B28]" />
          </div>
          <p className="text-[#E9DEC0] text-xs tracking-widest">YouTubeで再生 ↗</p>
        </button>
      ) : (
        <div className="relative w-full aspect-video bg-[#0F1B28] border border-[#2E4A3E] flex items-center justify-center overflow-hidden">
          <div className="w-24 h-24 rounded-full bg-gradient-to-br from-[#C9A66B] to-[#4A6B4D]" style={{ animation: playing ? "breathe 4s ease-in-out infinite" : "none" }} />
          <p className="absolute bottom-3 left-3 text-[10px] text-[#5A6A62] tracking-widest">AI生成動画プレースホルダー(未登録)</p>
        </div>
      )}

      <div className="flex items-center gap-4 text-[#9FB0A6] text-sm">
        <span className="tabular-nums tracking-wider">{mm}:{ss}</span>
        <span className="text-[#5A6A62]">/ {cls.minutes}:00</span>
      </div>

      <button onClick={onEnd} className="mt-2 px-6 py-3 bg-[#243A52] border border-[#2E4A3E] text-[#E9DEC0] text-sm tracking-wide hover:border-[#C9A66B] transition-colors">
        レッスンを終えてマットを出る
      </button>
    </div>
  );
}

function YogaQuest() {
  const [screen, setScreen] = useState("exterior");
  const [selected, setSelected] = useState(null);

  return (
    <div className="min-h-screen w-full bg-[#152230] flex items-center justify-center p-6 relative overflow-hidden">
      <div className="absolute inset-0 opacity-40 pointer-events-none" style={{ background: "radial-gradient(circle at 50% 20%, rgba(201,166,107,0.12), transparent 60%)" }} />
      <div className="relative z-10 w-full flex items-center justify-center" style={{ fontFamily: "'Zen Kaku Gothic New', sans-serif" }}>
        {screen === "exterior" && <Building onEnter={() => setScreen("cafe")} />}
        {screen === "cafe" && <Cafe onUpstairs={() => setScreen("studio")} />}
        {screen === "studio" && <Studio onBack={() => setScreen("cafe")} onSelect={(c) => { setSelected(c); setScreen("session"); }} />}
        {screen === "session" && selected && <Session cls={selected} onEnd={() => setScreen("studio")} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<YogaQuest />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
