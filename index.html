<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anicca Yoga</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Anicca Yoga">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b1d12;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e2e8f0;
        }
        .scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-size: cover;
            background-position: center;
            transition: opacity 0.5s ease;
            opacity: 0;
        }
        .scene.active {
            display: flex;
            opacity: 1;
        }
        .btn {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            text-align: center;
            min-width: 200px;
            margin-top: 20px;
        }
        .btn:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.3);
        }
        .title {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .subtitle {
            font-size: 14px;
            color: #a0aec0;
            margin-bottom: 40px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }
        #scene-building { background: linear-gradient(135deg, #0b1d12 0%, #1c3d27 100%); }
        #scene-cafe { background: linear-gradient(135deg, #1c3d27 0%, #2f5c3e 100%); }
        #scene-studio { background: linear-gradient(135deg, #2f5c3e 0%, #14351f 100%); }
        #scene-video { background: #000000; }

        .video-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background-color: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 1. 建物のシーン -->
    <div id="scene-building" class="scene active">
        <h1 class="title">Anicca Yoga</h1>
        <p class="subtitle">Entrance</p>
        <button class="btn" onclick="changeScene('scene-cafe')">建物に入る</button>
    </div>

    <!-- 2. カフェのシーン -->
    <div id="scene-cafe" class="scene">
        <h1 class="title">Yoga Cafe</h1>
        <p class="subtitle">Relaxation Space</p>
        <button class="btn" onclick="changeScene('scene-studio')">スタジオへ進む</button>
        <button class="btn" style="font-size:12px; min-width:120px; margin-top:40px; opacity:0.6;" onclick="changeScene('scene-building')">戻る</button>
    </div>

    <!-- 3. スタジオのシーン -->
    <div id="scene-studio" class="scene">
        <h1 class="title">Yoga Studio</h1>
        <p class="subtitle">Select Your Lesson</p>
        <button class="btn" onclick="changeScene('scene-video')">レッスン動画を再生</button>
        <button class="btn" style="font-size:12px; min-width:120px; margin-top:40px; opacity:0.6;" onclick="changeScene('scene-cafe')">戻る</button>
    </div>

    <!-- 4. 動画再生のシーン -->
    <div id="scene-video" class="scene">
        <div class="video-container">
            <video id="yoga-video" controls playsinline loop poster="icons/icon-512.png">
                <source src="https://w3schools.com" type="video/mp4">
                お使いのブラウザはビデオタグをサポートしていません。
            </video>
        </div>
        <button class="btn" onclick="stopVideoAndReturn()">スタジオに戻る</button>
    </div>

    <script>
        function changeScene(sceneId) {
            const scenes = document.querySelectorAll('.scene');
            scenes.forEach(scene => {
                scene.classList.remove('active');
            });

            const targetScene = document.getElementById(sceneId);
            if (targetScene) {
                targetScene.classList.add('active');
            }

            const video = document.getElementById('yoga-video');
            if (sceneId === 'scene-video' && video) {
                video.play().catch(e => console.log("自動再生ブロック:", e));
            }
        }

        function stopVideoAndReturn() {
            const video = document.getElementById('yoga-video');
            if (video) {
                video.pause();
                video.currentTime = 0;
            }
            changeScene('scene-studio');
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered:', reg.scope))
                    .catch(err => console.log('SW failed:', err));
            });
        }
    </script>
</body>
</html>
